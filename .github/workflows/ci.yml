name: CI

on:
  workflow_dispatch:
  push:
    branches: ["v2"]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  format:
    name: Format
    timeout-minutes: 1
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Format
        run: npm run format

      - name: Git push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git status | grep -q modified; then
            git commit -m "style: automatic formatting"
            git push
          fi

  lint:
    name: Lint
    timeout-minutes: 3
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    env:
      TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -- --affected

  check_types:
    name: Check types
    timeout-minutes: 3
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    env:
      TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cache turbo build setup
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run check-types -- --affected

  test:
    name: Test
    needs: [lint, check_types]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    env:
      TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cache turbo build setup
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test -- --affected

  e2e:
    name: E2E tests
    needs: [lint, check_types]
    timeout-minutes: 15
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    env:
      TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cache turbo build setup
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx -w e2e playwright install --with-deps chromium

      # Offline: every service the checks call answers from
      # tests/e2e/scenarios, so a failure is a real one.
      - name: E2E tests
        run: npm run test:e2e -- --affected

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          retention-days: 14

  e2e_live:
    name: Live E2E tests
    needs: [lint, check_types]
    timeout-minutes: 15
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    env:
      TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx -w e2e playwright install --with-deps chromium

      # Live: the real services, so a failure can come from the network or from
      # upstream data changing. Report it, but don't fail CI.
      - name: Live E2E tests
        id: live
        continue-on-error: true
        run: npm run test:e2e:live -- --affected

      - name: Warn on live E2E test failure
        if: steps.live.outcome == 'failure'
        run: echo "::warning title=Live E2E tests failed::Live E2E tests failed. They depend on external services, so this doesn't block the merge. Check the Live E2E tests step log before merging."

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-live
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          retention-days: 14

  test_live:
    name: Live tests
    needs: [lint, check_types]
    timeout-minutes: 10
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    env:
      TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Live tests call real external services, so a failure can come from the
      # network or from upstream data changing. Report it, but don't fail CI.
      - name: Live tests
        id: live
        continue-on-error: true
        run: npm run test:live -- --affected -- --retry=2

      - name: Warn on live test failure
        if: steps.live.outcome == 'failure'
        run: echo "::warning title=Live tests failed::Live tests failed. They depend on external services, so this doesn't block the merge. Check the Live tests step log before merging."
